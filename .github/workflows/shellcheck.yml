name: shellcheck

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        env:
          # SC1090/SC1091: dynamic `source "$ENV_FILE"` — file is runtime-only.
          SHELLCHECK_OPTS: -e SC1090 -e SC1091 -o all
